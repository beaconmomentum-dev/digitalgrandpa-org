<!-- Update your existing product buttons to open the modal instead of redirecting -->

<!-- Example: Replace your current buy buttons with these -->

<!-- Single Product Example -->
<button class="buy-button" 
        data-price="29.99" 
        data-product-type="rest-first-guide"
        onclick="openPaymentModal()">
    Buy Now - $29.99
</button>

<!-- Bundle Example -->
<button class="buy-button" 
        data-price="97.00" 
        data-product-type="complete-system"
        onclick="openPaymentModal()">
    Get Complete System - $97.00
</button>

<!-- Alternative approach using data attributes and event listeners -->
<div class="product-card">
    <h3>Rest First, Then Rebuild</h3>
    <p class="price">$29.99</p>
    <button class="buy-button" 
            data-price="29.99" 
            data-product-type="rest-first-guide"
            data-product-name="Rest First, Then Rebuild">
        Add to Cart
    </button>
</div>

<div class="product-card">
    <h3>Complete Digital Grandpa System</h3>
    <p class="price">$97.00</p>
    <button class="buy-button" 
            data-price="97.00" 
            data-product-type="complete-system"
            data-product-name="Complete Digital Grandpa System">
        Buy Now
    </button>
</div>

<!-- CSS for product buttons -->
<style>
.buy-button {
    background: linear-gradient(135deg, #8b0000 0%, #b22222 100%);
    color: white;
    padding: 15px 30px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    width: 100%;
}

.buy-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 16px rgba(139, 0, 0, 0.3);
}

.product-card {
    background: white;
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    text-align: center;
    margin-bottom: 30px;
}

.product-card h3 {
    color: #333;
    margin-bottom: 15px;
    font-size: 24px;
}

.product-card .price {
    font-size: 32px;
    font-weight: 700;
    color: #b8860b;
    margin-bottom: 20px;
}
</style>
