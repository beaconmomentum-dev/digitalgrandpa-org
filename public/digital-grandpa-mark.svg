<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Digital Grandpa hurricane-lamp emblem</title>
  <desc id="desc">A simple charcoal silhouette of an older man carrying a glowing hurricane lamp, on a warm parchment field. This is a Digital Grandpa mark and is distinct from Beacon Momentum’s lighthouse.</desc>
  <defs>
    <radialGradient id="lampGlow">
      <stop offset="0" stop-color="#F3C76A" stop-opacity=".62"/>
      <stop offset=".55" stop-color="#F3C76A" stop-opacity=".22"/>
      <stop offset="1" stop-color="#F3C76A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="22" y="22" width="596" height="596" rx="150" fill="#F3E8D6"/>
  <rect x="22" y="22" width="596" height="596" rx="150" fill="none" stroke="#244239" stroke-width="16"/>
  <circle cx="320" cy="320" r="260" fill="none" stroke="#D7C29D" stroke-width="3"/>
  <circle cx="457" cy="340" r="126" fill="url(#lampGlow)"/>
  <g fill="none" stroke="#D39A49" stroke-width="5" stroke-linecap="round" opacity=".58">
    <path d="M457 190v-24"/><path d="M517 211l15-19"/><path d="M548 269l23-7"/>
    <path d="M546 407l22 9"/><path d="M516 465l14 19"/>
  </g>
  <g fill="#171A18">
    <!-- Older man in profile, facing the lamp; the long chin and beard remain one readable silhouette. -->
    <path d="M247 248c-25-17-42-45-44-79-3-42 18-74 53-87 36-13 72 5 82 39 5 15 4 29 5 39l19 17-18 11c-1 19-12 36-29 47-9 6-16 16-19 29l-49 1z"/>
    <!-- Cloak and torso. -->
    <path d="M244 246c-31 6-56 28-72 61-18 38-19 82-16 133l-3 25h93l15-67 18 67h99l-3-51c-3-69-26-121-65-150-12-9-27-15-43-20l-23 24z"/>
    <!-- Walking legs and shoes. -->
    <path d="M202 447c-1 30-12 57-25 83l38 10c22-25 33-57 37-93z"/>
    <path d="M293 448c6 33 20 63 42 87l37-12c-15-28-24-55-29-84z"/>
    <path d="M174 522c-14 4-22 15-23 29h64l5-15-5-10z"/>
    <path d="M330 525c10 14 28 22 55 22 10 0 18-5 21-13l-34-17z"/>
    <!-- Extended arm and hand holding the lantern. -->
    <path d="M311 286c36 4 68 9 104 20" fill="none" stroke="#171A18" stroke-width="35" stroke-linecap="round"/>
    <circle cx="416" cy="306" r="14"/>
  </g>
  <!-- Hurricane lantern: handle, crown, glass, wick and base. -->
  <g stroke="#171A18" stroke-linejoin="round" stroke-linecap="round">
    <path d="M425 302v-25c0-28 49-28 49 0v25" fill="none" stroke-width="11"/>
    <path d="M411 302h77l-10 17h-57z" fill="#171A18" stroke-width="6"/>
    <path d="M423 319h53v81l-13 18h-28l-12-18z" fill="#DFA84F" stroke-width="11"/>
    <path d="M432 328v67m35-67v67M426 332h47m-47 59h47" fill="none" stroke="#171A18" stroke-width="7"/>
    <path d="M450 375c-13-13 0-23 4-35 13 12 18 24 10 36-4 7-11 7-14-1z" fill="#FFF2C4" stroke="none"/>
    <path d="M414 414h72l-11 15h-50z" fill="#171A18" stroke-width="6"/>
  </g>
</svg>
